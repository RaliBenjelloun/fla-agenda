name: Mise à jour agenda FLA
on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours ~6h/7h Paris (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
        env: { TEAM_IDS: "7" }
      - name: Commit si changement
        run: |
          git config user.name "fla-agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          # Keepalive mensuel : GitHub coupe les crons après 60 j sans commit.
          if [ "$(date -u +%d)" = "01" ]; then date -u +%F > calendars/.last-check; fi
          git add calendars
          git diff --cached --quiet && echo "rien à commiter" && exit 0
          git commit -m "Mise à jour calendrier $(date -u +%F)"
          git push
